<!DOCTYPE html>
<html>
<head>
  <title>Accounting</title>
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>

<div class="container">
  <div class="card">

    <h2 id="fileTitle"></h2>

    <!-- ADD MODE + SEARCH -->
    <div class="add-mode-row">
      <span>Add Mode</span>

      <label class="switch">
        <input type="checkbox" id="plusToggle" checked>
        <span class="slider"></span>
      </label>

      <button onclick="openSearch()" style="margin-left:400px;">Search</button>
    </div>

    <div id="totals"></div>

    <div class="action-buttons">
      <button onclick="goBack()">⬅ Back</button>
      <button onclick="exportExcel()">Export Excel</button>
      <button onclick="goDashboard()">Dashboard</button>
    </div>

  </div>
</div>

<!-- EDIT MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <input id="modalInput" type="number">
    <div class="modal-buttons">
      <button onclick="saveModal()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SEARCH MODAL -->
<div id="searchModal" class="modal">
  <div class="modal-content">

    <h3>Search</h3>

    <input id="searchHead" placeholder="Head">
    <input id="searchVote" placeholder="Vote">

    <div class="custom-select" onclick="toggleDropdown()">
  <span id="searchDS">Ds</span>

  <div id="dropdownList" class="dropdown-list">
    <div onclick="selectDS('Ds')">Ds</div>
    <div onclick="selectDS('Kalutara')">Kalutara</div>
    <div onclick="selectDS('Panadura')">Panadura</div>
    <div onclick="selectDS('Bandaragama')">Bandaragama</div>
    <div onclick="selectDS('Agalawatta')">Agalawatta</div>
    <div onclick="selectDS('Beruwala')">Beruwala</div>
    <div onclick="selectDS('Bulathsinhala')">Bulathsinhala</div>
    <div onclick="selectDS('Dodangoda')">Dodangoda</div>
    <div onclick="selectDS('Horana')">Horana</div>
    <div onclick="selectDS('Madurawala')">Madurawala</div>
    <div onclick="selectDS('Millaniya')">Millaniya</div>
    <div onclick="selectDS('Palindanuwara')">Palindanuwara</div>
    <div onclick="selectDS('Matugama')">Matugama</div>
    <div onclick="selectDS('Walallawita')">Walallawita</div>
    <div onclick="selectDS('Ingiriya')">Ingiriya</div>
  </div>
</div>

    <br><br>
    <button onclick="doSearch()">Search</button>
    <button onclick="closeSearch()">Cancel</button>

  </div>
</div>

<!-- CUSTOM POPUP -->
<div id="popup" class="modal">
  <div class="modal-content">
    <p id="popupText"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/result.js"></script>

<script>
function loadTitle(){
  let user = localStorage.getItem("currentUser");
  let files = JSON.parse(localStorage.getItem("files_" + user)||"[]");
  let id = localStorage.getItem("currentFile");
  let file = files.find(f => f.id === id);

  document.getElementById("fileTitle").innerText =
    file ? file.name : "File";
}

window.onload = function(){
  loadTitle();
  render();
};
</script>

<div id="dateModal" class="modal">
  <div class="modal-content">

    <h3>Enter Date</h3>

    <input id="dateDay" type="number" placeholder="Day" class="input">

    <select id="dateMonth" style="
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  width:100%;
  font-size:16px;
  background:white;
">
  <option value="">Select Month</option>
  <option value="1">January</option>
  <option value="2">February</option>
  <option value="3">March</option>
  <option value="4">April</option>
  <option value="5">May</option>
  <option value="6">June</option>
  <option value="7">July</option>
  <option value="8">August</option>
  <option value="9">September</option>
  <option value="10">October</option>
  <option value="11">November</option>
  <option value="12">December</option>
</select>

    <input id="dateYear" type="number" placeholder="Year" class="input">

    <div style="margin-top:15px;">
      <button onclick="generateDSReport()">Enter</button>
      <button onclick="closeDateModal()">Close</button>
    </div>

  </div>
</div>
  
</body>
</html>
