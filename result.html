<!DOCTYPE html>
<html>
<head>
  <title>Accounting</title>
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>

<div class="container">
  <div class="card">

    <h2 id="fileTitle"></h2>

    <!-- ADD MODE + SEARCH -->
    <div class="add-mode-row">
      <span>Add Mode</span>

      <label class="switch">
        <input type="checkbox" id="plusToggle" checked>
        <span class="slider"></span>
      </label>

      <button onclick="openSearch()" style="margin-left:25px;">Search</button>
    </div>

    <div id="totals"></div>

    <div class="action-buttons">
      <button onclick="goBack()">⬅ Back</button>
      <button onclick="exportExcel()">Export Excel</button>
      <button onclick="goDashboard()">Dashboard</button>
    </div>

  </div>
</div>

<!-- EDIT MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>
    <input id="modalInput" type="number">
    <div class="modal-buttons">
      <button onclick="saveModal()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SEARCH MODAL -->
<div id="searchModal" class="modal">
  <div class="modal-content">

    <h3>Search</h3>

    <input id="searchHead" placeholder="Head">
    <input id="searchVote" placeholder="Vote">

    <select id="searchDS">
      <option>Ds</option>
      <option>Kalutara</option>
      <option>Panadura</option>
      <option>Bandaragama</option>
      <option>Agalawatta</option>
      <option>Beruwala</option>
      <option>Bulathsinhala</option>
      <option>Dodangoda</option>
      <option>Horana</option>
      <option>Madurawala</option>
      <option>Millaniya</option>
      <option>Palindanuwara</option>
      <option>Matugama</option>
      <option>Walallawita</option>
      <option>Ingiriya</option>
    </select>

    <br><br>
    <button onclick="doSearch()">Search</button>
    <button onclick="closeSearch()">Cancel</button>

  </div>
</div>

<!-- CUSTOM POPUP -->
<div id="popup" class="modal">
  <div class="modal-content">
    <p id="popupText"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script src="js/result.js"></script>

<script>
function loadTitle(){
  let user = localStorage.getItem("currentUser");
  let files = JSON.parse(localStorage.getItem("files_" + user)||"[]");
  let id = localStorage.getItem("currentFile");
  let file = files.find(f => f.id === id);

  document.getElementById("fileTitle").innerText =
    file ? file.name : "File";
}

window.onload = function(){
  loadTitle();
  render();
};
</script>

</body>
</html>
