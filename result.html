<!DOCTYPE html>
<html>
<head>
  <title>Accounting</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Excel Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
  <div class="card">

    <h2 id="fileTitle"></h2>

    <div id="totals"></div>

    <div>
      <button onclick="goBack()">⬅ Back</button>
      <button onclick="exportExcel()">Export Excel</button>
      <button onclick="save()">Finish</button>
      <button onclick="goDashboard()">Dashboard</button>
    </div>

  </div>
</div>

<!-- CUSTOM MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Enter Amount</h3>
    <input id="modalInput" type="number" placeholder="Enter amount">
    <div class="modal-buttons">
      <button onclick="saveModal()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="js/result.js"></script>

<script>
document.getElementById("fileTitle").innerText =
  localStorage.getItem("fileName") || "New File";
</script>

</body>
</html>
