<!DOCTYPE html>
<html>
<head>
  <title>DS Report</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- PDF LIB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
#report {
  width: 100%;
  overflow-x: auto;
}

/* 🔥 FIX WIDTH */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

/* 🔥 SMALLER TEXT */
th, td {
  font-size: 9px;
  padding: 4px;
  text-align: center;
  word-break: break-word;
}

/* 🔥 HEADER */
th {
  background: #2d5bd1;
  color: white;
}

/* 🔥 WRAP CONTENT */
td {
  white-space: normal;
}

  /* 🔥 SET COLUMN WIDTHS */

th:nth-child(1), td:nth-child(1) { width: 5%; }   /* No */
th:nth-child(2), td:nth-child(2) { width: 10%; }  /* Head */
th:nth-child(3), td:nth-child(3) { width: 15%; }  /* Vote */

/* 🔥 HALF WIDTH FOR NUMERIC COLUMNS */
th:nth-child(4), td:nth-child(4),
th:nth-child(5), td:nth-child(5),
th:nth-child(6), td:nth-child(6) {
  width: 8%; /* 🔥 reduced */
}
  
</style>
  
</head>
<body>

<div class="container">
  <div class="card">

    <div style="margin-bottom:20px;">
      <button id="pdfBtn" onclick="downloadPDF()">Download PDF</button>
    </div>

    <div id="report"></div>

  </div>
</div>

<script>
  // load table
  document.getElementById("report").innerHTML =
    localStorage.getItem("dsReportHTML");

  function downloadPDF(){

  let btn = document.getElementById("pdfBtn");
  btn.style.display = "none";

  let element = document.getElementById("report");

  html2pdf().set({
    margin: 3,
    filename: 'DS_Report.pdf',
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: {
      unit: 'mm',
      format: 'a4',
      orientation: 'landscape'
    },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
  }).from(element).save().then(()=>{
    btn.style.display = "block";
  });
}
  
</script>

</body>
</html>
