<!DOCTYPE html>
<html>
<head>
  <title>DS Report</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- PDF LIB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
#report, #historyTable {
  width: 100%;
  max-width: 100%;
}

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed; /* 🔥 VERY IMPORTANT */
}

th, td {
  word-wrap: break-word;
  font-size: 10px; /* 🔥 shrink text */
  padding: 4px;
}
</style>
  
</head>
<body>

<div class="container">
  <div class="card">

    <div style="margin-bottom:20px;">
      <button id="pdfBtn" onclick="downloadPDF()">Download PDF</button>
    </div>

    <div id="report"></div>

  </div>
</div>

<script>
  // load table
  document.getElementById("report").innerHTML =
    localStorage.getItem("dsReportHTML");

  function downloadPDF(){

  let btn = document.getElementById("pdfBtn");
  btn.style.display = "none";

  let element = document.getElementById("report");

  html2pdf().set({
    margin: 5,
    filename: 'DS_Report.pdf',
    image: { type: 'jpeg', quality: 1 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } // 🔥 FIX
  }).from(element).save().then(()=>{
    btn.style.display = "block";
  });
}
  
</script>

</body>
</html>
