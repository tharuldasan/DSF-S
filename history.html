<!DOCTYPE html>
<html>
<head>
  <title>History</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <div class="card">

    <h2 style="text-align:center;">History</h2>

    <!-- 🔍 SEARCH -->
    <div style="text-align:center; margin:15px 0;">
      <input id="searchInput" placeholder="Search files..."
        oninput="searchFiles()"
        style="width:80%; padding:10px; border-radius:10px; border:1px solid #ccc;">
    </div>

    <!-- 📁 FILE LIST -->
    <div id="files"></div>

    <!-- BACK -->
    <div style="margin-top:20px; text-align:center;">
      <button onclick="window.location='dashboard.html'">⬅ Back</button>
    </div>

  </div>
</div>

<!-- 🔥 RENAME MODAL -->
<div id="renameModal" class="modal">
  <div class="modal-content">
    <h3>Rename File</h3>
    <input id="renameInput" placeholder="Enter new name">
    <div class="modal-buttons">
      <button onclick="confirmRename()">Save</button>
      <button onclick="closeRename()">Cancel</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/history.js"></script>

</body>
</html>
